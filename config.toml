# KleenTrainer settings. Hand-edited.

# Exact text of the game client's title bar.
window_title = "Kaizen v92"

# Seconds to wait after bringing the client to the front before capturing.
focus_settle_s = 0.5

# Live loop: frames captured per second.
capture_fps = 10

# Live debug overlay: "game" draws directly over the client; "window" shows
# a scaled copy in a separate window (replay always uses the window).
overlay = "game"
# Separate overlay window size relative to the client (0.5 = half size).
overlay_scale = 0.4

[minimap]
# Lowest match score (0 to 1) for the - / + / WORLD buttons to count as found.
button_min_score = 0.9
# Highest color difference for the minimap frame corners to count as found.
corner_max_rms = 8.0
# Lowest match score (0 to 1) for the yellow player dot to count as found.
dot_min_score = 0.7

[player]
# Crop of this character's name tag box (cut one per character).
name_tag = "templates/name_tag.png"
# Lowest tag score (0 to 1) to count as found. Visible tags score 0.96 to
# 1.0, tags partly covered by mobs about 0.77, other spots at most 0.38.
min_score = 0.6
# Seconds to keep the last position when the tag is covered.
lost_hold_s = 1.0
# The game world ends here; below is the chat bar and status bar, which also
# show the character's name.
world_bottom = 1050

[status]
# Bars are read along one row: [first x, last x, y] in client pixels.
hp_bar = [330, 487, 1135]
mp_bar = [492, 649, 1135]
# Seconds without a normal minimap before the screen counts as unexpected.
minimap_missing_s = 3
# Headline of the death dialog, where it appears (top-left, client pixels),
# and the lowest match score (0 to 1). It scores 1.0; other frames <= 0.24.
death_dialog = "templates/death_dialog.png"
death_dialog_at = [935, 203]
death_min_score = 0.8

[hotkeys]
# Saves the current frame as a PNG in the run folder.
save_frame = "delete"
