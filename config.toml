# KleenTrainer settings. Hand-edited.

# Exact text of the game client's title bar.
window_title = "Kaizen v92"

# Training map; marked points are saved in points/<map_name>.json.
map_name = "henesys_hunting_ground_1"

# Seconds to wait after bringing the client to the front before capturing.
focus_settle_s = 0.5

# Live loop: frames captured per second.
capture_fps = 10

# Live debug overlay: "game" draws directly over the client; "window" shows
# a scaled copy in a separate window (replay always uses the window).
overlay = "game"
# Separate overlay window size relative to the client (0.5 = half size).
overlay_scale = 0.4

[minimap]
# Lowest match score (0 to 1) for the - / + / WORLD buttons to count as found.
button_min_score = 0.9
# Highest color difference for the minimap frame corners to count as found.
corner_max_rms = 8.0
# Lowest match score (0 to 1) for the yellow player dot to count as found.
dot_min_score = 0.7

[player]
# Crop of this character's name tag box (cut one per character).
name_tag = "templates/name_tag.png"
# Lowest tag score (0 to 1) to count as found. Visible tags score 0.96 to
# 1.0, tags partly covered by mobs about 0.77, other spots at most 0.38.
min_score = 0.6
# Seconds to keep the last position when the tag is covered.
lost_hold_s = 1.0
# The game world ends here; below is the chat bar and status bar, which also
# show the character's name.
world_bottom = 1050

[status]
# Bars are read along one row: [first x, last x, y] in client pixels.
hp_bar = [330, 487, 1135]
mp_bar = [492, 649, 1135]
# Seconds without a normal minimap before the screen counts as unexpected.
minimap_missing_s = 3
# Headline of the death dialog, where it appears (top-left, client pixels),
# and the lowest match score (0 to 1). It scores 1.0; other frames <= 0.24.
death_dialog = "templates/death_dialog.png"
death_dialog_at = [935, 203]
death_min_score = 0.8

[mobs]
# Mobs to detect (the training map's bottom floor): folder name under
# templates/mobs/ = mob ID. Red Snail (130101) and Orange Mushroom (1210102)
# live elsewhere on the map.
blue_snail = 100101
shroom = 120100

[mob_detection]
# A mob is reachable when its feet are within this many px (up or down) of
# the character's feet.
height_tolerance = 10
# Highest grey-level difference for a match. Real mobs score 0.5 to 7.
max_rms = 12
# Looser limit for the rough half-size pass that picks candidates. Real mobs
# score up to about 39 there, spots without mobs 43 and up.
rough_max_rms = 45

[keys]
# Game keybinds by action, as pydirectinput key names.
jump = "alt"
left = "left"
right = "right"
minimap = "m"

[movement]
# All distances in minimap px.
# Walking stops within this distance of the target x.
arrive_tolerance = 1
# Within this distance the arrow key is pulsed instead of held, to avoid
# overshooting; each pulse holds it this long (s).
slow_zone = 4
pulse_s = 0.08
# Walking fails if the distance has not shrunk for this long (s).
no_progress_s = 3
# Two heights within this distance count as the same level.
level_tolerance = 1
# Longest wait for a jump to land (s).
jump_timeout_s = 2.0
# Platform search: takeoff spots this far apart, up to this far to each
# side of the safe spot, and at most this many jumps. Straight-up jumps at
# every takeoff spot come first, then jumps toward the spot.
search_step = 2
search_max_offset = 30
search_max_tries = 60

[focus]
# Focus losses in a row (without a full minute between them) that stop the
# run instead of refocusing.
max_losses_in_a_row = 3

[hotkeys]
# Saves the current frame as a PNG in the run folder.
save_frame = "delete"
# Adds a safe spot at the character's current minimap position.
mark_safe_spot = "home"
# Removes the safe spot nearest the character.
remove_safe_spot = "page_down"
# Stops the bot (and from stage 7 releases all keys).
kill = "end"

[points]
# Marking within this many minimap px of an existing safe spot moves that
# spot instead of adding a new one.
merge_distance = 5

[log]
# Seconds between status lines in run.log.
status_interval_s = 60
