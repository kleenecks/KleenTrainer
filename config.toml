# KleenTrainer settings. Hand-edited.

# Exact text of the game client's title bar.
window_title = "Kaizen v92"

# Training map; marked points are saved in points/<map_name>.json.
map_name = "henesys_hunting_ground_1"

# Seconds to wait after bringing the client to the front before capturing.
focus_settle_s = 0.5

# Live loop: at most this many frames per second. The loop waits out the
# rest of each frame's time before capturing the next, and anything that
# happens during that wait is seen late; at 20 the loop (about 60-70 ms per
# frame) runs as fast as it can.
capture_fps = 20

# Live debug overlay: "game" draws directly over the client; "window" shows
# a scaled copy in a separate window (replay always uses the window).
overlay = "game"
# Separate overlay window size relative to the client (0.5 = half size).
overlay_scale = 0.4

[capture]
# Capture only the regions the detectors read (a full-width strip around the
# character's feet, the minimap, the HP/MP bars, the death-dialog area)
# instead of the whole client: capture is the slowest step. A full frame is
# still taken when the name tag or minimap must be searched for again, and
# every full_every_s seconds.
regions = true
full_every_s = 1.0
# Extra rows (px) above and below the strip's computed height.
strip_margin = 20
# Each capture call costs ~6 ms on top of its pixels: the HP/MP bars and the
# death dialog are only captured every this many frames (about twice a
# second at 10 frames per second).
slow_every = 5

[minimap]
# Lowest match score (0 to 1) for the - / + / WORLD buttons to count as found.
button_min_score = 0.9
# Highest color difference for the minimap frame corners to count as found.
corner_max_rms = 8.0
# Lowest match score (0 to 1) for the yellow player dot to count as found.
dot_min_score = 0.7

[player]
# Crop of this character's name tag box (cut one per character).
name_tag = "templates/name_tag.png"
# Lowest tag score (0 to 1) to count as found. Visible tags score 0.96 to
# 1.0, tags partly covered by mobs about 0.77, other spots at most 0.38.
min_score = 0.6
# Seconds to keep the last position when the tag is covered.
lost_hold_s = 1.0
# The game world ends here; below is the chat bar and status bar, which also
# show the character's name.
world_bottom = 1050

[status]
# Bars are read along one row: [first x, last x, y] in client pixels.
hp_bar = [330, 487, 1135]
mp_bar = [492, 649, 1135]
# Seconds without a normal minimap before the screen counts as unexpected.
minimap_missing_s = 3
# Headline of the death dialog, where it appears (top-left, client pixels),
# and the lowest match score (0 to 1). It scores 1.0; other frames <= 0.24.
death_dialog = "templates/death_dialog.png"
death_dialog_at = [935, 203]
death_min_score = 0.8

[mobs]
# Mobs to detect (the training map's bottom floor): folder name under
# templates/mobs/ = mob ID. Red Snail (130101) and Orange Mushroom (1210102)
# live elsewhere on the map.
blue_snail = 100101
shroom = 120100

[mob_detection]
# A mob is reachable when its feet are within this many px (up or down) of
# the character's feet.
height_tolerance = 10
# Highest grey-level difference for a match. Real mobs score 0.5 to 7.
max_rms = 12
# Looser limit for the rough half-size pass that picks candidates. Real mobs
# score up to about 39 there, spots without mobs 43 and up.
rough_max_rms = 45
# A mob partly covered (tooltip, loot, effects) fails max_rms but is still
# accepted if at least this share of its pixels match (each within
# pixel_tolerance per color channel). Snails under a tooltip: 0.97; a Red
# Snail against the Blue Snail sprite: 0.68 (must fail); a Shroom 40%
# under loot: 0.59 (still missed).
min_match_share = 0.8
pixel_tolerance = 30

[keys]
# Game keybinds by action, as pydirectinput key names.
jump = "alt"
left = "left"
right = "right"
minimap = "m"
attack = "ctrl"
loot = "z"
# The chair item's key (to sit while resting). To be set in the GUI later.
chair = "y"

[map]
# Screen px per minimap px: the map's minimap area is 2317 game px wide
# (maplestory.io map data, Henesys Hunting Ground I) shown as 214 minimap px,
# and the client stretches the game 1.5x: 2317 / 214 * 1.5 = 16.2.
screen_px_per_minimap_px = 16.2

[loot]
# After a kill, walk (loot key held) the way the character faced, this many
# screen px past the spot where the mob died. 60 went too far; trying 40.
past_px = 40

[sweep]
# While sweeping, the minimap x unchanged this long (s) = a wall: turn around.
wall_s = 1.0
# Stay this many minimap px away from each side of the minimap (the
# character gets lost at the very edges): sweeping turns around there, and
# mobs beyond it are not targeted.
edge_margin = 20

[rest]
# HP % below which the bot goes to rest (stage 10); the loot walk after a
# kill is skipped below it.
hp_low_percent = 90
# HP % that counts as full: the bot gets up (the bar reading can stop a
# hair short of 100).
hp_full_percent = 95
# On the way to rest, jump when a mob is within this many screen px ahead.
jump_over_px = 60
# Being hit blocks the chair for a while: sit only once HP has not dropped
# for this many seconds. If HP is not rising this many seconds after pressing
# the chair key, press it again. Chairs restore HP in steps, so the check
# must be longer than one step (a re-press while sitting may stand up).
chair_wait_s = 1.5
chair_check_s = 2.5
# Wait this many seconds after arriving at the safe spot before the first
# chair press (overlaps chair_wait_s).
arrive_wait_s = 2
# After resting, walking off the safe spot must reach the floor within this
# many seconds; otherwise (or at a wall) the bot turns and tries the other way.
exit_timeout_s = 4

[attack]
# Attack when the target's feet are within this many screen px (left or
# right) of the character's feet. 90 hit; raised to try further out.
range_px = 130
# Once attacking, keep at it while the target is within the range plus this
# many px (stops the attack/walk flip-flop at the edge of range).
hold_margin_px = 10
# While attacking, the target counts as dead after this many seconds unseen
# (a dying mob vanishes from detection); shorter gaps keep swinging.
target_lost_s = 0.2
# A target not seen for this many seconds while walking to it is given up.
lost_s = 0.5
# While walking to the target (not yet attacking), a mob at least this many
# screen px closer takes over and the far target is forgotten (only a mob
# no healthier than the target).
retarget_margin_px = 100
# Target choice: the lowest-HP mob (read from the HP bar shown above hurt
# mobs) among those at most this many screen px farther than the nearest.
prefer_hurt_within_px = 300
# Side choice: each mob weighs (2 - HP share) / (1 + distance / this), and
# the bot goes to the side (left/right) whose mobs weigh more. Smaller =
# closeness matters more; larger = numbers matter more. At 150, one mob
# 30 px away beats two at 200 and 300 px, and five at 400-800 px beat one
# 50 px away.
side_falloff_px = 150
# Lead the target by this many seconds while walking toward it: the bot acts
# on slightly old frames, so it starts attacking when the gap expected this
# much later is in range. 0 = no prediction (attack only when actually in
# range). 0.2 sometimes started swings that missed completely; trying 0.
lead_s = 0
# Log each change of the attacker's action (walk, turn, attack, killed,
# lost) with the measured gap, to diagnose odd behavior. Off for overnight
# runs.
debug_log = true

[movement]
# All distances in minimap px.
# Walking stops within this distance of the target x.
arrive_tolerance = 1
# Within this distance the arrow key is pulsed instead of held, to avoid
# overshooting; each pulse holds it this long (s).
slow_zone = 4
pulse_s = 0.08
# Walking fails if the distance has not shrunk for this long (s).
no_progress_s = 3
# Two heights within this distance count as the same level.
level_tolerance = 1
# Longest wait for a jump to land (s).
jump_timeout_s = 2.0
# Landed = the height unchanged for land_still_s, at least min_air_s after
# the jump (the height also stays put briefly at the top of a jump).
min_air_s = 0.5
land_still_s = 0.25
# Keep holding the arrow this many seconds after a moving jump, then let go:
# the jump keeps its sideways momentum in the air, and holding on until
# touchdown walked the character past the spot after landing. Raise it if
# running jumps fall short.
air_hold_s = 0.15
# A running jump backs up this many minimap px before running at the
# takeoff point.
runup = 6
# Platform search: takeoff spots this far apart, up to this far to each
# side of the safe spot, and at most this many jumps. Running jumps toward
# the spot come first, then straight-up jumps, then standing jumps toward
# the spot.
search_step = 2
search_max_offset = 30
search_max_tries = 60

[focus]
# Focus losses in a row (without a full minute between them) that stop the
# run instead of refocusing.
max_losses_in_a_row = 3

[hotkeys]
# Saves the current frame as a PNG in the run folder.
save_frame = "delete"
# Adds a safe spot at the character's current minimap position.
mark_safe_spot = "home"
# Removes the safe spot nearest the character.
remove_safe_spot = "page_down"
# Stops the bot (and from stage 7 releases all keys).
kill = "end"

[points]
# Marking within this many minimap px of an existing safe spot moves that
# spot instead of adding a new one.
merge_distance = 5

[log]
# Seconds between status lines in run.log.
status_interval_s = 60
# Seconds between client screenshots (run folder, screenshots/); one is also
# taken at every stop.
screenshot_every_s = 300
